[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptm-lollipop"
version = "0.1.0"
description = "Generate reusable PTM lollipop plots from SGD annotations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyMuPDF>=1.24",
  "reportlab>=3.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=7"
]

[project.scripts]
ptm-lollipop = "ptm_lollipop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
